name: Compilar relaxPlayer APK (Nativo)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Preparar recursos, logo y fuente Poppins
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/logo.png ]; then
            FOUND_LOGO=$(find . -maxdepth 3 -type f \( -iname "logo.*" -o -iname "icon.*" \) \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) ! -path "./.git/*" | head -n 1 || true)
            if [ -n "$FOUND_LOGO" ]; then
              cp "$FOUND_LOGO" assets/logo.png
              echo "Logo detectado y copiado desde: $FOUND_LOGO"
            fi
          fi
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Regular.ttf -o assets/fonts/Poppins-Regular.ttf
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Medium.ttf -o assets/fonts/Poppins-Medium.ttf
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-SemiBold.ttf -o assets/fonts/Poppins-SemiBold.ttf
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf -o assets/fonts/Poppins-Bold.ttf

      - name: Generar estructura Android y recursos de notificacion
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart lib/main.dart.bak
          flutter create . --platforms android --org com.relaxplayer --project-name relaxplayer
          mv pubspec.yaml.bak pubspec.yaml
          mv lib/main.dart.bak lib/main.dart
          cp android_manifest.xml android/app/src/main/AndroidManifest.xml

          # Desactivar tareas de Android Lint que se traban en plugins como image_picker_android
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts

          allprojects {
              tasks.configureEach {
                  if (name.contains("lint", ignoreCase = true)) {
                      enabled = false
                  }
              }
          }
          EOF
          elif [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle

          allprojects {
              tasks.configureEach {
                  if (name.toLowerCase().contains("lint")) {
                      enabled = false
                  }
              }
          }
          EOF
          fi

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/raw

          cat << 'EOF' > android/app/src/main/res/raw/keep.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/ic_media_*,@drawable/ic_stat_*,@drawable/audio_service_*,@mipmap/*" />
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_stat_relax.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,3C7.03,3 3,7.03 3,12v7c0,1.1 0.9,2 2,2h2c1.1,0 2,-0.9 2,-2v-4c0,-1.1 -0.9,-2 -2,-2H5v-1c0,-3.87 3.13,-7 7,-7s7,3.13 7,7v1h-2c-1.1,0 -2,0.9 -2,2v4c0,1.1 0.9,2 2,2h2c1.1,0 2,-0.9 2,-2v-7C21,7.03 16.97,3 12,3z" />
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_media_prev.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M6,6h2v12H6V6zM9.5,12l8.5,6V6L9.5,12z" />
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_media_next.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z" />
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_media_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M8,5v14l11,-7L8,5z" />
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_media_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M6,19h4V5H6v14zM14,5v14h4V5h-4z" />
          </vector>
          EOF

      - name: Instalar dependencias y generar icono
        run: |
          flutter pub get
          if [ -f assets/logo.png ]; then
            dart run flutter_launcher_icons || true
          fi

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: relaxPlayer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
